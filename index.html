<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進入網站</title>
    <style>
        /* 1. 全局樣式：純黑背景、隱藏滾動條、完美居中 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 2. 入口按鈕樣式 */
        #start-btn {
            padding: 18px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #222222 0%, #111111 100%);
            border: 2px solid #333333;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            z-index: 10;
        }

        #start-btn:hover {
            background: linear-gradient(135deg, #333333 0%, #222222 100%);
            border-color: #555555;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
            transform: scale(1.03);
        }

        /* 3. 小丑內容容器（一開始隱藏） */
        #clown-container {
            display: none; /* 由 JS 控制顯示 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 4. 又大又紅的圓形小丑鼻（適中大小，附帶呼吸燈動畫） */
        .clown-nose {
            width: 140px;
            height: 140px;
            background-color: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 35px #ff0000, inset -15px -15px 30px rgba(0,0,0,0.4);
            animation: breathe 2s infinite ease-in-out;
        }

        /* 5. 提示文字樣式：極低透明度（約 3% 灰色） */
        .hint-text {
            margin-top: 40px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.03); /* 3% 透明度 */
            text-align: center;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* 6. 呼吸燈動畫效果 */
        @keyframes breathe {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 50px rgba(255, 0, 0, 0.9);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>

    <!-- 入口按鈕 -->
    <!-- 使用者必須點擊此按鈕，才能成功繞過瀏覽器限制並播放音效 -->
    <button id="start-btn">進入網站</button>

    <!-- 小丑惡作劇主體 -->
    <div id="clown-container">
        <!-- 紅鼻子 -->
        <div class="clown-nose"></div>
        <!-- 誘導調高亮度的文字（照鏡子效果） -->
        <div class="hint-text">（請將螢幕亮度調至最大以獲得最佳體驗）</div>
    </div>

    <!-- 背景音樂控制：已修改為您的指定相對路徑 -->
    <audio id="bg-music" src="audio/hawaiian-cocktail.mp3" loop></audio>

    <script>
        const startBtn = document.getElementById('start-btn');
        const clownContainer = document.getElementById('clown-container');
        const bgMusic = document.getElementById('bg-music');

        startBtn.addEventListener('click', () => {
            // 1. 瞬間隱藏點擊按鈕
            startBtn.style.display = 'none';
            
            // 2. 瞬間顯示小丑全黑畫面與紅鼻子
            clownContainer.style.display = 'flex';
            
            // 3. 播放海綿寶寶背景音樂，並將音量調至最大
            bgMusic.volume = 1.0;
            bgMusic.play().catch(error => {
                console.log("播放失敗，瀏覽器可能封鎖了音效：", error);
            });
        });
    </script>
</body>
</html>
